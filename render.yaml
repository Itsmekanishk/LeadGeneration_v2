services:
  - type: web
    name: leadgen-backend
    plan: free
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: BUSINESS_PROVIDER
        value: geoapify
      - key: GEOAPIFY_API_KEY
        value: 22c8f318c1be4b3bbf97041358ccf09a
      - key: PROVIDER_STRICT_CONFIG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: leadgen-db
    databaseName: locallead
    user: locallead
    plan: free
