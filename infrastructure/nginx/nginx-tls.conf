# LocalLead Intelligence — Production HTTPS Nginx Configuration
# Active when SSL certificates are installed at /etc/nginx/certs/

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Allow Let's Encrypt Certbot ACME domain verification over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (port 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Production HSTS header
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    set $api_upstream api:8000;
    set $frontend_upstream frontend:3000;

    include /etc/nginx/locallead_proxy_params.conf;
}
