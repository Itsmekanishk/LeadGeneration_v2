client_max_body_size 2m;
proxy_http_version 1.1;

# ACME challenge for Certbot / Let's Encrypt free SSL
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# --- API ---
# NOTE: with variable upstreams nginx passes the URI verbatim, so the
# /backend prefix is stripped explicitly via rewrite (the trailing-slash
# proxy_pass trick only works with static upstreams).
location /backend/ {
    limit_req zone=api_limit burst=60 nodelay;
    rewrite ^/backend/?(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # SSE (job progress stream): disable buffering
    proxy_buffering off;
    proxy_cache off;
}

location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

# --- Frontend ---
location / {
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js HMR in development
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# --- Security headers ---
# NOTE: no HSTS here — this is the plain-HTTP dev entrypoint. HSTS sent over
# HTTP lets a browser latch an HTTPS-only policy from a dev visit; it belongs
# in the TLS server block only (see nginx-tls.conf.example).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
