name: locallead

# Shared environment for api + worker. Values here override any .env;
# provider credentials and tuning knobs come from the shell env or `.env`
# (compose reads it automatically when present).
x-backend-env: &backend-env
  environment:
    - DATABASE_URL=postgresql+psycopg2://locallead:locallead@postgres:5432/locallead
    - REDIS_URL=redis://redis:6379/0
    - PDF_STORAGE_PATH=/srv/data/reports
    - APP_ENV=${APP_ENV:-production}
    - BUSINESS_PROVIDER=${BUSINESS_PROVIDER:-nominatim}
    - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY:-}
    - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    - SERPER_API_KEY=${SERPER_API_KEY:-}
    - SMTP_HOST=${SMTP_HOST:-}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - SMTP_FROM=${SMTP_FROM:-}
    - PROVIDER_STRICT_CONFIG=${PROVIDER_STRICT_CONFIG:-false}
    - SECRET_KEY=${SECRET_KEY:-locallead-production-secret-replace-me-12345}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost,https://localhost}
    - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
    - MAX_RESULTS=${MAX_RESULTS:-60}
    - MAX_PAGES_PER_DOMAIN=${MAX_PAGES_PER_DOMAIN:-5}
    - CRAWL_TIMEOUT=${CRAWL_TIMEOUT:-12}
    - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-4}
    - CRAWL_JOB_CONCURRENCY=${CRAWL_JOB_CONCURRENCY:-4}
    - ENABLE_WEBSITE_CRAWLING=${ENABLE_WEBSITE_CRAWLING:-true}
    - RATE_LIMIT_SEARCH_PER_MIN=${RATE_LIMIT_SEARCH_PER_MIN:-10}
    - RATE_LIMIT_API_PER_MIN=${RATE_LIMIT_API_PER_MIN:-120}
    - GOOGLE_PLACES_TEXT_SEARCH_COST_PER_CALL=${GOOGLE_PLACES_TEXT_SEARCH_COST_PER_CALL:-0.032}
    - GOOGLE_PLACES_DETAILS_COST_PER_CALL=${GOOGLE_PLACES_DETAILS_COST_PER_CALL:-0.017}
    - ENABLE_NOMINATIM_GEOCODE=${ENABLE_NOMINATIM_GEOCODE:-true}
    - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT:-LocalLeadIntelligence/1.0 (+https://github.com/locallead-intel; contact@localleadintel.org)}
    - ENABLE_DISIFY_CHECKS=${ENABLE_DISIFY_CHECKS:-true}
    - APILAYER_API_KEY=${APILAYER_API_KEY:-}
    - NUMVERIFY_API_KEY=${NUMVERIFY_API_KEY:-}
    - APILAYER_MAILBOX_BASE_URL=${APILAYER_MAILBOX_BASE_URL:-https://apilayer.net/api/check}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: locallead
      POSTGRES_PASSWORD: locallead
      POSTGRES_DB: locallead
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locallead"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    <<: *backend-env
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - reports:/srv/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/worker.Dockerfile
    <<: *backend-env
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://locallead:locallead@postgres:5432/locallead
      - REDIS_URL=redis://redis:6379/0
      - PDF_STORAGE_PATH=/srv/data/reports
      - APP_ENV=${APP_ENV:-production}
      - BUSINESS_PROVIDER=${BUSINESS_PROVIDER:-nominatim}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PROVIDER_STRICT_CONFIG=${PROVIDER_STRICT_CONFIG:-false}
      - SECRET_KEY=${SECRET_KEY:-locallead-production-secret-replace-me-12345}
      - MAX_PAGES_PER_DOMAIN=${MAX_PAGES_PER_DOMAIN:-5}
      - CRAWL_TIMEOUT=${CRAWL_TIMEOUT:-12}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-4}
      - CRAWL_JOB_CONCURRENCY=${CRAWL_JOB_CONCURRENCY:-4}
      - ENABLE_WEBSITE_CRAWLING=${ENABLE_WEBSITE_CRAWLING:-true}
      - ENABLE_NOMINATIM_GEOCODE=${ENABLE_NOMINATIM_GEOCODE:-true}
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT:-LocalLeadIntelligence/1.0 (+https://github.com/locallead-intel; contact@localleadintel.org)}
      - ENABLE_DISIFY_CHECKS=${ENABLE_DISIFY_CHECKS:-true}
      - APILAYER_API_KEY=${APILAYER_API_KEY:-}
      - NUMVERIFY_API_KEY=${NUMVERIFY_API_KEY:-}
      - APILAYER_MAILBOX_BASE_URL=${APILAYER_MAILBOX_BASE_URL:-https://apilayer.net/api/check}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
    volumes:
      - reports:/srv/data/reports
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/locallead_proxy_params.conf:/etc/nginx/locallead_proxy_params.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  reports:
